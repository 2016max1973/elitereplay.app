<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ÉliteReplay NetCam Duel Viewer</title>
  <style>
    :root {
      --bg: #030303;
      --gold: #d6b15e;
      --text: #f4efe4;
      --muted: rgba(244, 239, 228, 0.68);
      --split-position: 50%;
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
    }

    body {
      display: grid;
      grid-template-rows: 1fr;
    }

    .viewer {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background: #030303;
      user-select: none;
      cursor: default;
    }

    .split-stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #050505;
      contain: layout paint;
    }

    .pane {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #050505;
      transform: translateZ(0);
      backface-visibility: hidden;
    }

    .pane.left {
      z-index: 2;
      clip-path: inset(0 calc(100% - var(--split-position)) 0 0);
      will-change: clip-path;
    }

    .pane.right { z-index: 1; }

    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #050505;
      pointer-events: none;
      transform: translateZ(0);
      backface-visibility: hidden;
    }

    .camera-label {
      position: absolute;
      left: 26px;
      bottom: 24px;
      z-index: 9;
      padding: 8px 12px;
      border: 1px solid rgba(214, 177, 94, .34);
      border-radius: 999px;
      color: rgba(244, 239, 228, .86);
      background: rgba(0, 0, 0, .38);
      backdrop-filter: blur(12px);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
      pointer-events: none;
    }

    .camera-label.right {
      right: 26px;
      left: auto;
    }

    .divider-hitbox {
      position: absolute;
      top: 0;
      bottom: 0;
      left: var(--split-position);
      z-index: 8;
      width: 54px;
      transform: translateX(-50%);
      cursor: grab;
      touch-action: none;
      will-change: left;
    }

    .viewer.is-dragging .divider-hitbox {
      cursor: grabbing;
    }

    .divider-line {
      position: absolute;
      top: 0;
      left: 50%;
      width: 3px;
      height: 100%;
      transform: translateX(-50%);
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(214,177,94,.18), var(--gold) 18%, #f1d58d 50%, var(--gold) 82%, rgba(214,177,94,.18));
      box-shadow:
        0 0 14px rgba(214, 177, 94, .5),
        0 0 34px rgba(214, 177, 94, .26),
        0 0 0 1px rgba(0, 0, 0, .38);
      pointer-events: none;
    }

    .divider-grip {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 32px;
      height: 88px;
      transform: translate(-50%, -50%);
      display: grid;
      place-items: center;
      border: 1px solid rgba(214, 177, 94, .52);
      border-radius: 999px;
      background: rgba(7, 7, 7, .58);
      box-shadow: 0 18px 45px rgba(0,0,0,.42), 0 0 22px rgba(214,177,94,.18);
      backdrop-filter: blur(10px);
      pointer-events: none;
    }

    .divider-grip::before,
    .divider-grip::after {
      content: "";
      width: 2px;
      height: 34px;
      border-radius: 999px;
      background: rgba(244, 239, 228, .74);
      box-shadow: 0 0 10px rgba(214,177,94,.38);
    }

    .divider-grip::after { margin-left: 5px; }
    .divider-grip { grid-auto-flow: column; gap: 0; }

    .viewer.is-dragging .divider-line {
      width: 4px;
      box-shadow:
        0 0 18px rgba(214, 177, 94, .72),
        0 0 48px rgba(214, 177, 94, .34),
        0 0 0 1px rgba(0, 0, 0, .38);
    }

    .topbar {
      position: absolute;
      top: 24px;
      left: 24px;
      right: 24px;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      pointer-events: none;
    }

    .brand {
      display: grid;
      gap: 3px;
      padding: 12px 14px;
      border: 1px solid rgba(244, 239, 228, .1);
      border-radius: 8px;
      background: rgba(0, 0, 0, .38);
      backdrop-filter: blur(14px);
      box-shadow: 0 16px 42px rgba(0,0,0,.34);
    }

    .brand strong {
      color: var(--text);
      font-size: 13px;
      line-height: 1;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .brand span {
      color: var(--gold);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }

    button {
      min-height: 38px;
      border: 1px solid rgba(214, 177, 94, .3);
      border-radius: 999px;
      padding: 8px 13px;
      color: rgba(244, 239, 228, .9);
      background: rgba(0, 0, 0, .42);
      box-shadow: 0 12px 30px rgba(0,0,0,.28);
      backdrop-filter: blur(14px);
      font-size: 12px;
      font-weight: 850;
      letter-spacing: .08em;
      text-transform: uppercase;
      cursor: pointer;
    }

    button:hover,
    button:focus-visible,
    button[aria-pressed="true"] {
      border-color: rgba(214, 177, 94, .7);
      color: #fff;
      outline: none;
    }

    button[aria-pressed="true"] {
      background: rgba(214, 177, 94, .2);
    }

    .hint {
      position: absolute;
      right: 24px;
      bottom: 70px;
      z-index: 9;
      max-width: min(360px, calc(100vw - 48px));
      color: rgba(244, 239, 228, .66);
      font-size: 12px;
      line-height: 1.45;
      text-align: right;
      text-shadow: 0 3px 16px rgba(0,0,0,.85);
      pointer-events: none;
    }

    @media (max-width: 760px) {
      .topbar {
        top: 14px;
        left: 14px;
        right: 14px;
        align-items: flex-start;
      }

      .brand {
        padding: 10px 11px;
      }

      .controls {
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      button {
        min-height: 34px;
        padding: 7px 10px;
        font-size: 10px;
      }

      .camera-label {
        left: 14px;
        bottom: 14px;
        font-size: 10px;
      }

      .camera-label.right {
        right: 14px;
        left: auto;
      }

      .divider-hitbox { width: 64px; }
      .divider-grip { width: 34px; height: 76px; }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <main class="viewer" id="viewer" aria-label="ÉliteReplay NetCam duel split viewer">
    <section class="split-stage">
      <div class="pane left">
        <video
          id="leftVideo"
          data-desktop-src="/media/point12/netcam-duel/point_012_netcam_left_1080p50_web.mp4"
          data-mobile-src="/media/point12/netcam-duel/point_012_netcam_left_720p50_mobile.mp4"
          autoplay
          playsinline
          muted
          preload="auto"
        ></video>
      </div>
      <div class="pane right">
        <video
          id="rightVideo"
          data-desktop-src="/media/point12/netcam-duel/point_012_netcam_right_1080p50_web.mp4"
          data-mobile-src="/media/point12/netcam-duel/point_012_netcam_right_720p50_mobile.mp4"
          autoplay
          playsinline
          muted
          preload="auto"
        ></video>
      </div>
    </section>

    <span class="camera-label left">NetCam links</span>
    <span class="camera-label right">NetCam rechts</span>

    <div class="divider-hitbox" id="divider" role="slider" aria-label="NetCam split position" aria-valuemin="18" aria-valuemax="82" aria-valuenow="50" tabindex="0">
      <div class="divider-line"></div>
      <div class="divider-grip" aria-hidden="true"></div>
    </div>

    <header class="topbar">
      <div class="brand">
        <strong>ÉliteReplay</strong>
        <span>NetCam Duel</span>
      </div>
      <nav class="controls" aria-label="Viewer controls">
        <button id="playButton" type="button">Abspielen</button>
        <button data-rate="0.25" type="button" aria-label="25 Prozent Geschwindigkeit">25</button>
        <button data-rate="0.5" type="button" aria-label="50 Prozent Geschwindigkeit">50</button>
        <button data-rate="0.75" type="button" aria-label="75 Prozent Geschwindigkeit">75</button>
        <button data-rate="1" type="button" aria-label="Normale Geschwindigkeit" aria-pressed="true">100</button>
      </nav>
    </header>

    <p class="hint">Drag the gold divider. Videos stay synced; release near 25, 50, or 75 for a soft snap.</p>
  </main>

  <script>
    const viewer = document.getElementById('viewer');
    const divider = document.getElementById('divider');
    const leftVideo = document.getElementById('leftVideo');
    const rightVideo = document.getElementById('rightVideo');
    const playButton = document.getElementById('playButton');
    const minSplit = 18;
    const maxSplit = 82;
    const snapPoints = [25, 50, 75];
    const snapDistance = 5;
    const hardDriftThreshold = 0.1;
    const softDriftThreshold = 0.06;
    const settledDriftThreshold = 0.03;

    let currentSplit = 50;
    let targetSplit = 50;
    let dragging = false;
    let splitRafId = null;
    let syncRafId = null;
    let videoFrameCallbackId = null;
    let lastSyncCheck = 0;
    let lastHardSync = 0;
    let manualPause = false;
    let autoStartAttempted = false;
    let syncLock = false;
    let loopLock = false;
    let resumeAfterVisibility = false;
    let playbackRate = 1;
    let userEnabledAudio = false;

    const metrics = {
      samples: 0,
      maxDriftMs: 0,
      hardSyncCorrections: 0,
      forcedAlignments: 0,
      softRateCorrections: 0,
      loops: 0,
    };

    const useMobileProxy = window.matchMedia('(max-width: 767px)').matches
      || Boolean(navigator.connection?.saveData);

    [leftVideo, rightVideo].forEach((video) => {
      video.src = useMobileProxy ? video.dataset.mobileSrc : video.dataset.desktopSrc;
    });

    const clamp = (value) => Math.min(maxSplit, Math.max(minSplit, value));

    const setSplit = (value, immediate = false) => {
      targetSplit = clamp(value);
      if (immediate) currentSplit = targetSplit;
      if (!splitRafId) splitRafId = requestAnimationFrame(animateSplit);
    };

    const animateSplit = () => {
      const stiffness = dragging ? 0.32 : 0.18;
      currentSplit += (targetSplit - currentSplit) * stiffness;
      if (Math.abs(targetSplit - currentSplit) < 0.04) currentSplit = targetSplit;
      viewer.style.setProperty('--split-position', `${currentSplit}%`);
      divider.setAttribute('aria-valuenow', String(Math.round(currentSplit)));
      if (currentSplit !== targetSplit) {
        splitRafId = requestAnimationFrame(animateSplit);
      } else {
        splitRafId = null;
      }
    };

    const splitFromClientX = (clientX) => {
      const rect = viewer.getBoundingClientRect();
      return ((clientX - rect.left) / rect.width) * 100;
    };

    const nearestSnap = (value) => {
      const nearest = snapPoints.reduce((best, point) => {
        return Math.abs(point - value) < Math.abs(best - value) ? point : best;
      }, snapPoints[0]);
      return Math.abs(nearest - value) <= snapDistance ? nearest : value;
    };

    divider.addEventListener('pointerdown', (event) => {
      event.preventDefault();
      dragging = true;
      viewer.classList.add('is-dragging');
      divider.setPointerCapture(event.pointerId);
      setSplit(splitFromClientX(event.clientX));
    });

    divider.addEventListener('pointermove', (event) => {
      if (!dragging) return;
      event.preventDefault();
      setSplit(splitFromClientX(event.clientX));
    });

    const finishDrag = (event) => {
      if (!dragging) return;
      dragging = false;
      viewer.classList.remove('is-dragging');
      if (event?.pointerId !== undefined && divider.hasPointerCapture(event.pointerId)) {
        divider.releasePointerCapture(event.pointerId);
      }
      setSplit(nearestSnap(targetSplit));
    };

    divider.addEventListener('pointerup', finishDrag);
    divider.addEventListener('pointercancel', finishDrag);

    divider.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowLeft') {
        event.preventDefault();
        setSplit(targetSplit - 3);
      }
      if (event.key === 'ArrowRight') {
        event.preventDefault();
        setSplit(targetSplit + 3);
      }
      if (event.key === 'Home') {
        event.preventDefault();
        setSplit(minSplit);
      }
      if (event.key === 'End') {
        event.preventDefault();
        setSplit(maxSplit);
      }
      if (event.key === ' ') {
        event.preventDefault();
        togglePlayback();
      }
    });

    const videoReady = (video) => video.readyState >= HTMLMediaElement.HAVE_FUTURE_DATA;

    const applyAudioPolicy = () => {
      rightVideo.muted = true;
      leftVideo.muted = !userEnabledAudio || playbackRate < 0.75;
    };

    const setPlaybackRate = (rate, fromUser = false) => {
      playbackRate = rate;
      if (fromUser) userEnabledAudio = true;
      leftVideo.playbackRate = rate;
      rightVideo.playbackRate = rate;
      applyAudioPolicy();
      document.querySelectorAll('[data-rate]').forEach((button) => {
        button.setAttribute('aria-pressed', String(Number(button.dataset.rate) === rate));
      });
    };

    document.querySelectorAll('[data-rate]').forEach((button) => {
      button.addEventListener('click', () => setPlaybackRate(Number(button.dataset.rate), true));
    });

    const syncTime = (force = false) => {
      if (syncLock || !Number.isFinite(leftVideo.currentTime) || !Number.isFinite(rightVideo.currentTime)) return;
      const now = performance.now();
      const drift = leftVideo.currentTime - rightVideo.currentTime;
      const absDrift = Math.abs(drift);
      metrics.samples += 1;
      metrics.maxDriftMs = Math.max(metrics.maxDriftMs, absDrift * 1000);

      if (force) {
        syncLock = true;
        rightVideo.currentTime = leftVideo.currentTime;
        rightVideo.playbackRate = playbackRate;
        metrics.forcedAlignments += 1;
        window.setTimeout(() => {
          syncLock = false;
        }, 80);
        return;
      }

      if (absDrift > hardDriftThreshold && now - lastHardSync > 1000) {
        syncLock = true;
        rightVideo.currentTime = leftVideo.currentTime;
        rightVideo.playbackRate = playbackRate;
        lastHardSync = now;
        metrics.hardSyncCorrections += 1;
        window.setTimeout(() => {
          syncLock = false;
        }, 80);
        return;
      }

      if (absDrift > softDriftThreshold) {
        const rateNudge = Math.min(playbackRate * 0.04, 0.03);
        const adjustedRate = playbackRate + Math.sign(drift) * rateNudge;
        if (Math.abs(rightVideo.playbackRate - adjustedRate) > 0.001) {
          rightVideo.playbackRate = adjustedRate;
          metrics.softRateCorrections += 1;
        }
      } else if (absDrift < settledDriftThreshold && Math.abs(rightVideo.playbackRate - playbackRate) > 0.001) {
        rightVideo.playbackRate = playbackRate;
      }
    };

    const updatePlayButton = () => {
      playButton.textContent = leftVideo.paused ? 'Abspielen' : 'Pause';
    };

    const playBoth = async ({ userInitiated = false } = {}) => {
      manualPause = false;
      if (userInitiated) userEnabledAudio = true;
      setPlaybackRate(playbackRate);
      syncTime(true);
      const results = await Promise.allSettled([leftVideo.play(), rightVideo.play()]);
      if (results.some((result) => result.status === 'rejected')) {
        leftVideo.pause();
        rightVideo.pause();
      }
      updatePlayButton();
    };

    const pauseBoth = () => {
      manualPause = true;
      leftVideo.pause();
      rightVideo.pause();
      updatePlayButton();
    };

    const togglePlayback = async () => {
      if (leftVideo.paused || rightVideo.paused) {
        await playBoth({ userInitiated: true });
      } else {
        pauseBoth();
      }
    };

    const tryAutoStart = async () => {
      if (autoStartAttempted || manualPause) return;
      if (!videoReady(leftVideo) || !videoReady(rightVideo)) return;
      autoStartAttempted = true;
      await playBoth();
    };

    const loopBoth = async () => {
      if (loopLock) return;
      loopLock = true;
      metrics.loops += 1;
      leftVideo.pause();
      rightVideo.pause();
      leftVideo.currentTime = 0;
      rightVideo.currentTime = 0;
      setPlaybackRate(playbackRate);
      syncTime(true);
      if (!manualPause && document.visibilityState === 'visible') {
        await playBoth();
      }
      loopLock = false;
    };

    const monitorPlayback = (now) => {
      if (now - lastSyncCheck >= 80 && !leftVideo.paused && !rightVideo.paused) {
        lastSyncCheck = now;
        syncTime();
      }

      if ('requestVideoFrameCallback' in leftVideo) {
        videoFrameCallbackId = leftVideo.requestVideoFrameCallback(monitorPlayback);
      } else {
        syncRafId = requestAnimationFrame(monitorPlayback);
      }
    };

    const startPlaybackMonitor = () => {
      if ('requestVideoFrameCallback' in leftVideo) {
        videoFrameCallbackId = leftVideo.requestVideoFrameCallback(monitorPlayback);
      } else {
        syncRafId = requestAnimationFrame(monitorPlayback);
      }
    };

    const videoQuality = (video) => {
      const quality = typeof video.getVideoPlaybackQuality === 'function'
        ? video.getVideoPlaybackQuality()
        : null;
      return {
        currentSrc: video.currentSrc,
        currentTime: video.currentTime,
        playbackRate: video.playbackRate,
        droppedVideoFrames: quality?.droppedVideoFrames ?? video.webkitDroppedFrameCount ?? 0,
        totalVideoFrames: quality?.totalVideoFrames ?? video.webkitDecodedFrameCount ?? 0,
      };
    };

    window.__netcamDuelMetrics = {
      snapshot: () => ({
        ...metrics,
        currentDriftMs: Math.abs(leftVideo.currentTime - rightVideo.currentTime) * 1000,
        playbackRate,
        left: videoQuality(leftVideo),
        right: videoQuality(rightVideo),
      }),
    };

    playButton.addEventListener('click', togglePlayback);
    viewer.addEventListener('dblclick', togglePlayback);

    [leftVideo, rightVideo].forEach((video) => {
      video.muted = true;
      video.playsInline = true;
      video.autoplay = true;
      video.loop = false;
      video.playbackRate = playbackRate;
      video.addEventListener('loadedmetadata', tryAutoStart);
      video.addEventListener('canplay', tryAutoStart);
      video.addEventListener('error', () => {
        console.error('NetCam video failed to load', video.currentSrc, video.error);
      });
      video.addEventListener('play', () => {
        updatePlayButton();
        if (!syncLock && video === leftVideo && rightVideo.paused && !manualPause) {
          rightVideo.play().catch(() => {});
        }
        if (!syncLock && video === rightVideo && leftVideo.paused && !manualPause) {
          leftVideo.play().catch(() => {});
        }
      });
      video.addEventListener('pause', updatePlayButton);
      video.addEventListener('seeking', () => {
        if (!syncLock && video === leftVideo) syncTime(true);
      });
    });

    leftVideo.addEventListener('ended', () => {
      void loopBoth();
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') {
        resumeAfterVisibility = !leftVideo.paused && !manualPause;
        leftVideo.pause();
        rightVideo.pause();
        return;
      }

      if (resumeAfterVisibility && !manualPause) {
        resumeAfterVisibility = false;
        syncTime(true);
        void playBoth();
      }
    });

    setSplit(50, true);
    setPlaybackRate(1);
    startPlaybackMonitor();
    updatePlayButton();
  </script>
</body>
</html>
